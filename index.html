<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bass Chord Reference — Smart Voice Leading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f0f0d;
        --bg2: #161614;
        --surface: #1c1c19;
        --surface2: #222220;
        --border: rgba(255, 255, 255, 0.08);
        --border-l: rgba(255, 255, 255, 0.05);
        --text: #f0efe8;
        --text2: #9a9990;
        --text3: #5a5a52;
        --accent: #e8c547;
        --accent-dim: #7a6a1a;
        --accent-bg: rgba(232, 197, 71, 0.1);
        --gold: #f5c842;
        --green: #5dc96e;
        --blue: #5aadee;
        --red: #e86060;
        --purple: #a87de8;
        --n-rb: #0d2a45;
        --n-rf: #6bbdf5;
        --n-3b: #1a3408;
        --n-3f: #8ed465;
        --n-7b: #3a1f00;
        --n-7f: #f0a030;
        --n-tb: #251a45;
        --n-tf: #b09af0;
        --n-5b: #1e1e1c;
        --n-5f: #888078;
        --lil-warn: #e85050;
        --common-tone: #e8c547;
        --arrow-37: #e86060;
        --arrow-73: #5aadee;
        --shadow: 0 4px 32px rgba(0, 0, 0, 0.6);
      }
      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        font-size: 14px;
      }

      /* ── HEADER ── */
      .header {
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        padding: 1rem 1.5rem 0.8rem;
        position: sticky;
        top: 0;
        z-index: 200;
        backdrop-filter: blur(12px);
      }
      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 0.9rem;
        flex-wrap: wrap;
      }
      .logo {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .logo h1 {
        font-family: "DM Serif Display", serif;
        font-size: 19px;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: var(--text);
      }
      .logo-sub {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text3);
        font-family: "Space Mono", monospace;
      }
      .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* String mode toggle */
      .string-toggle {
        display: flex;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .st-btn {
        font-size: 11px;
        font-weight: 600;
        padding: 5px 13px;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        border: none;
        letter-spacing: 0.04em;
        font-family: "Space Mono", monospace;
        transition: all 0.15s;
      }
      .st-btn.active {
        background: var(--accent);
        color: #0f0f0d;
      }

      .tab-bar {
        display: flex;
        gap: 3px;
      }
      .tab-btn {
        font-size: 11px;
        font-weight: 500;
        padding: 5px 14px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.13s;
        letter-spacing: 0.06em;
        font-family: "Space Mono", monospace;
      }
      .tab-btn:hover {
        border-color: var(--accent-dim);
        color: var(--text);
      }
      .tab-btn.active {
        background: var(--accent-bg);
        color: var(--accent);
        border-color: var(--accent-dim);
      }

      .key-row {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .key-btn {
        width: 42px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--text2);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.13s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Space Mono", monospace;
      }
      .key-btn:hover {
        border-color: var(--accent-dim);
        color: var(--text);
      }
      .key-btn.active {
        background: var(--accent-bg);
        color: var(--accent);
        border-color: var(--accent-dim);
      }

      /* ── CONTROLS BAR ── */
      .controls {
        padding: 0.5rem 1.5rem;
        background: var(--bg2);
        border-bottom: 1px solid var(--border-l);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .filter-label {
        font-size: 10px;
        color: var(--text3);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        white-space: nowrap;
        font-family: "Space Mono", monospace;
      }
      .filter-bar {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .fbtn {
        font-size: 11px;
        padding: 3px 10px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.13s;
        font-family: "Space Mono", monospace;
      }
      .fbtn:hover {
        border-color: var(--accent-dim);
        color: var(--text);
      }
      .fbtn.active {
        background: var(--accent-bg);
        color: var(--accent);
        border-color: var(--accent-dim);
        font-weight: 600;
      }
      .badge {
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 20px;
        background: var(--surface);
        color: var(--text2);
        font-weight: 500;
        margin-left: auto;
        font-family: "Space Mono", monospace;
        border: 1px solid var(--border);
      }

      /* ── VOICE LEADING PANEL ── */
      .vl-panel {
        background: var(--bg2);
        border-bottom: 2px solid var(--accent-dim);
        padding: 1rem 1.5rem;
      }
      .vl-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        font-family: "Space Mono", monospace;
        margin-bottom: 0.75rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .vl-title::before {
        content: "◆";
        font-size: 8px;
      }
      .vl-input-row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .vl-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .vl-field label {
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-family: "Space Mono", monospace;
      }
      .vl-input {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 7px 12px;
        border-radius: 7px;
        font-size: 13px;
        font-family: "Space Mono", monospace;
        outline: none;
        transition: border-color 0.15s;
        min-width: 280px;
      }
      .vl-input:focus {
        border-color: var(--accent-dim);
      }
      .vl-input::placeholder {
        color: var(--text3);
      }
      .vl-btn {
        padding: 8px 20px;
        background: var(--accent);
        color: #0f0f0d;
        border: none;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.05em;
        font-family: "Space Mono", monospace;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .vl-btn:hover {
        background: #f5d060;
      }
      .vl-algo-opts {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .vl-opt-label {
        font-size: 10px;
        color: var(--text3);
        font-family: "Space Mono", monospace;
        letter-spacing: 0.05em;
      }
      .algo-btn {
        font-size: 10px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        font-family: "Space Mono", monospace;
        transition: all 0.13s;
      }
      .algo-btn.active {
        background: var(--accent-bg);
        color: var(--accent);
        border-color: var(--accent-dim);
      }

      /* LIL warning badge */
      .lil-warn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        background: rgba(232, 80, 80, 0.15);
        color: var(--lil-warn);
        padding: 2px 8px;
        border-radius: 12px;
        font-family: "Space Mono", monospace;
        border: 1px solid rgba(232, 80, 80, 0.3);
      }

      /* ── PROGRESSION RESULT ── */
      .prog-result {
        background: var(--bg);
        padding: 1rem 1.5rem 1.5rem;
        border-bottom: 1px solid var(--border);
      }
      .prog-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      .prog-label {
        font-size: 11px;
        color: var(--text3);
        font-family: "Space Mono", monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .prog-quality-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-left: auto;
      }
      .quality-badge {
        font-size: 10px;
        padding: 2px 9px;
        border-radius: 12px;
        font-family: "Space Mono", monospace;
      }
      .qb-smooth {
        background: rgba(93, 201, 110, 0.15);
        color: var(--green);
        border: 1px solid rgba(93, 201, 110, 0.3);
      }
      .qb-lil {
        background: rgba(232, 80, 80, 0.15);
        color: var(--lil-warn);
        border: 1px solid rgba(232, 80, 80, 0.3);
      }
      .qb-ergonomic {
        background: rgba(90, 173, 238, 0.15);
        color: var(--blue);
        border: 1px solid rgba(90, 173, 238, 0.3);
      }

      .prog-sequence {
        display: flex;
        align-items: flex-start;
        gap: 0;
        overflow-x: auto;
        padding-bottom: 8px;
      }
      .prog-chord-wrap {
        display: flex;
        align-items: center;
        gap: 0;
        flex-shrink: 0;
      }
      .prog-chord-block {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        min-width: 200px;
        max-width: 260px;
        flex-shrink: 0;
        position: relative;
      }
      .prog-chord-block.active-vl {
        border-color: var(--accent-dim);
        box-shadow: 0 0 0 1px var(--accent-dim);
      }
      .pcb-name {
        font-family: "DM Serif Display", serif;
        font-size: 22px;
        font-weight: 400;
        margin-bottom: 3px;
      }
      .pcb-function {
        font-size: 10px;
        color: var(--text3);
        font-family: "Space Mono", monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 0.75rem;
      }
      .pcb-fret {
        margin: 0.6rem 0;
      }

      /* Arrow connector between chords */
      .chord-arrow {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        gap: 5px;
        flex-shrink: 0;
        align-self: stretch;
        padding-top: 56px;
      }
      .voice-arrow {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 9px;
        font-family: "Space Mono", monospace;
        white-space: nowrap;
      }
      .va-label {
        width: 24px;
        text-align: center;
        font-size: 8px;
        opacity: 0.8;
        font-weight: 600;
      }
      .va-line {
        height: 1.5px;
        width: 32px;
        position: relative;
        border-radius: 2px;
      }
      .va-line::after {
        content: "▶";
        position: absolute;
        right: -2px;
        top: -5.5px;
        font-size: 9px;
      }
      .va-ct {
        color: var(--common-tone);
      }
      .va-37 {
        color: var(--arrow-37);
      }
      .va-73 {
        color: var(--arrow-73);
      }
      .va-other {
        color: var(--text3);
      }

      /* ── CONTENT ── */
      .content {
        padding: 1.2rem 1.5rem;
        max-width: 1280px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 13px;
        margin-bottom: 1.2rem;
        font-size: 12px;
        color: var(--text2);
      }
      .leg-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-family: "DM Sans", sans-serif;
      }
      .leg-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .group-block {
        margin-bottom: 2rem;
      }
      .group-label {
        font-size: 10px;
        font-weight: 600;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        padding-bottom: 5px;
        border-bottom: 1px solid var(--border-l);
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: "Space Mono", monospace;
      }
      .grp-cnt {
        opacity: 0.45;
        font-weight: 400;
      }

      /* ── TABLE ── */
      .ctable {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        background: var(--surface);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .ctable th {
        text-align: left;
        font-weight: 600;
        font-size: 10px;
        color: var(--text3);
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--bg2);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-family: "Space Mono", monospace;
      }
      .ctable td {
        padding: 8px 12px;
        border-bottom: 0.5px solid var(--border-l);
        vertical-align: middle;
        color: var(--text);
      }
      .ctable tr:last-child td {
        border-bottom: none;
      }
      .ctable tbody tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }
      .cname {
        font-weight: 500;
        font-size: 15px;
        font-family: "DM Serif Display", serif;
      }
      .caka {
        font-size: 10px;
        color: var(--text3);
        margin-top: 1px;
        font-family: "Space Mono", monospace;
      }
      .cfm {
        color: var(--text2);
        font-size: 11px;
        white-space: nowrap;
        font-family: "Space Mono", monospace;
      }
      .cnotes {
        font-family: "Space Mono", monospace;
        font-size: 11px;
        color: var(--text2);
        white-space: nowrap;
      }
      .ctip {
        font-size: 12px;
        color: var(--text2);
        max-width: 230px;
        line-height: 1.5;
      }
      .pills {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        min-width: 130px;
      }
      .pill {
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        font-family: "Space Mono", monospace;
      }
      .n-root {
        background: var(--n-rb);
        color: var(--n-rf);
      }
      .n-3rd {
        background: var(--n-3b);
        color: var(--n-3f);
      }
      .n-7th {
        background: var(--n-7b);
        color: var(--n-7f);
      }
      .n-tension {
        background: var(--n-tb);
        color: var(--n-tf);
      }
      .n-5th {
        background: var(--n-5b);
        color: var(--n-5f);
      }

      /* ── FRETBOARD CARDS ── */
      .fb-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem 1.1rem;
        margin-bottom: 1rem;
        transition: border-color 0.2s;
      }
      .fb-card:hover {
        border-color: rgba(255, 255, 255, 0.13);
      }
      .fb-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
        gap: 8px;
      }
      .fb-cname {
        font-size: 18px;
        font-weight: 400;
        font-family: "DM Serif Display", serif;
      }
      .fb-fm {
        font-size: 11px;
        color: var(--text3);
        margin-left: 8px;
        font-family: "Space Mono", monospace;
      }
      .fb-fret {
        overflow-x: auto;
        margin: 0.75rem 0 0.6rem;
      }
      .pos-wrap {
        overflow-x: auto;
      }
      .pos-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        min-width: 380px;
      }
      .pos-table th {
        text-align: center;
        font-weight: 600;
        font-size: 10px;
        color: var(--text3);
        padding: 5px 8px;
        border-bottom: 1px solid var(--border);
        background: var(--bg2);
        font-family: "Space Mono", monospace;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .pos-table th:first-child {
        text-align: left;
      }
      .pos-table td {
        padding: 5px 8px;
        border-bottom: 0.5px solid var(--border-l);
        text-align: center;
        color: var(--text2);
        font-size: 12px;
        font-family: "Space Mono", monospace;
      }
      .pos-table tr:last-child td {
        border-bottom: none;
      }
      .pos-table td:first-child {
        text-align: left;
      }
      .best {
        font-weight: 700;
        color: var(--text);
      }
      .open-lbl {
        font-size: 11px;
        font-style: italic;
        color: var(--text3);
      }
      .star {
        color: var(--accent);
        margin-left: 2px;
        font-size: 10px;
      }
      .lil-cell {
        color: var(--lil-warn) !important;
      }
      .lil-cell::after {
        content: " ⚠";
        font-size: 9px;
      }

      /* ── MINI CHORD DIAGRAM ── */
      .mini-diagram {
        position: relative;
      }
      .mini-diagram svg {
        display: block;
      }

      /* Common tone glow */
      .ct-note {
        filter: drop-shadow(0 0 6px var(--common-tone));
      }

      /* Responsive */
      @media (max-width: 800px) {
        .ctable th:nth-child(3),
        .ctable td:nth-child(3),
        .ctable th:nth-child(5),
        .ctable td:nth-child(5) {
          display: none;
        }
        .content {
          padding: 0.9rem;
        }
        .header {
          padding: 0.9rem 1rem 0.7rem;
        }
        .controls {
          padding: 0.45rem 1rem;
        }
        .vl-panel {
          padding: 0.8rem 1rem;
        }
        .vl-input {
          min-width: 200px;
        }
      }
      @media (max-width: 540px) {
        .ctable th:nth-child(2),
        .ctable td:nth-child(2) {
          display: none;
        }
        .key-btn {
          width: 35px;
          height: 33px;
          font-size: 11px;
        }
      }

      /* Transitions */
      .prog-result {
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .prog-chord-block {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .prog-chord-block:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <h1>Bass Chord Reference</h1>
          <span class="logo-sub">Smart Voice Leading</span>
        </div>
        <div class="header-controls">
          <!-- String mode toggle -->
          <div class="string-toggle" id="stringToggle">
            <button class="st-btn active" data-strings="4">
              4-STR E·A·D·G
            </button>
            <button class="st-btn" data-strings="5">5-STR +HiC</button>
          </div>
          <div class="tab-bar" id="tabBar">
            <button class="tab-btn active" data-tab="vl">VOICE LEAD</button>
            <button class="tab-btn" data-tab="vie">VIE</button>
            <button class="tab-btn" data-tab="eng">ENG</button>
            <button class="tab-btn" data-tab="fretboard">FRETBOARD</button>
          </div>
        </div>
      </div>
      <div class="key-row" id="keySelector"></div>
    </div>

    <!-- Voice Leading Panel (shown in VL tab) -->
    <div class="vl-panel" id="vlPanel" style="display: none">

    <script>
      // ── Enharmonic-correct note engine ─────────────────────────────────────────
      const MAJOR = {
        C: ["C", "D", "E", "F", "G", "A", "B"],
        Db: ["Db", "Eb", "F", "Gb", "Ab", "Bb", "C"],
        D: ["D", "E", "F#", "G", "A", "B", "C#"],
        Eb: ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
        E: ["E", "F#", "G#", "A", "B", "C#", "D#"],
        F: ["F", "G", "A", "Bb", "C", "D", "E"],
        "F#": ["F#", "G#", "A#", "B", "C#", "D#", "E#"],
        G: ["G", "A", "B", "C", "D", "E", "F#"],
        Ab: ["Ab", "Bb", "C", "Db", "Eb", "F", "G"],
        A: ["A", "B", "C#", "D", "E", "F#", "G#"],
        Bb: ["Bb", "C", "D", "Eb", "F", "G", "A"],
        B: ["B", "C#", "D#", "E", "F#", "G#", "A#"],
      };
      const N2S = {
        C: 0,
        "C#": 1,
        Db: 1,
        D: 2,
        "D#": 3,
        Eb: 3,
        E: 4,
        "E#": 5,
        Fb: 4,
        F: 5,
        "F#": 6,
        Gb: 6,
        G: 7,
        "G#": 8,
        Ab: 8,
        A: 9,
        "A#": 10,
        Bb: 10,
        B: 11,
        "B#": 0,
        Cb: 11,
      };
      const FL = [
        "C",
        "Db",
        "D",
        "Eb",
        "E",
        "F",
        "Gb",
        "G",
        "Ab",
        "A",
        "Bb",
        "B",
      ];
      const SH = [
        "C",
        "C#",
        "D",
        "D#",
        "E",
        "F",
        "F#",
        "G",
        "G#",
        "A",
        "A#",
        "B",
      ];
      const FLAT_K = new Set(["F", "Bb", "Eb", "Ab", "Db", "Gb"]);

      function applyAcc(note, acc) {
        if (!acc) return note;
        if (acc === "#") {
          if (note.endsWith("b")) return note.slice(0, -1);
          return note + "#";
        }
        if (acc === "b") {
          if (note.endsWith("#")) return note.slice(0, -1);
          return note + "b";
        }
        if (acc === "bb") {
          const s = N2S[note];
          if (s === undefined) return note;
          return FL[(((s - 2) % 12) + 12) % 12];
        }
        return note;
      }
      function iNote(key, deg, acc) {
        return applyAcc(MAJOR[key][deg - 1], acc);
      }
      function iSemi(key, deg, acc) {
        return N2S[iNote(key, deg, acc)];
      }
      function renderNi(ni, key) {
        return ni.map(([d, a]) => iNote(key, d, a)).join("–");
      }
      function noteToSemi(n) {
        return N2S[n] ?? 0;
      }
      function semiInterval(a, b) {
        return (((b - a) % 12) + 12) % 12;
      }
      function semitoneDistance(a, b) {
        const d = semiInterval(a, b);
        return Math.min(d, 12 - d);
      }

      function enharmonic(semi, key) {
        return (FLAT_K.has(key) ? FL : SH)[semi % 12];
      }

      // ── Chord name transposition ────────────────────────────────────────────────
      function tChord(name, key) {
        if (name.includes(" / "))
          return name
            .split(" / ")
            .map((p) => tChord(p, key))
            .join(" / ");
        const m = name.match(/^([A-G][#b]?)(.*)/);
        if (!m) return name;
        const names = FLAT_K.has(key) ? FL : SH;
        const rootSemi = N2S[m[1]];
        const keySemi = N2S[key];
        return names[(((rootSemi + keySemi) % 12) + 12) % 12] + m[2];
      }

      // ── String configurations ───────────────────────────────────────────────────
      // 4-string: E A D G (low to high), 5-string adds C above G
      const STRINGS_4 = [
        { name: "G", semi: 7, sw: 0.8, yPct: 14 },
        { name: "D", semi: 2, sw: 1.2, yPct: 38 },
        { name: "A", semi: 9, sw: 1.8, yPct: 62 },
        { name: "E", semi: 4, sw: 2.5, yPct: 86 },
      ];
      const STRINGS_5 = [
        { name: "C", semi: 0, sw: 0.6, yPct: 6, hiC: true },
        { name: "G", semi: 7, sw: 0.9, yPct: 25 },
        { name: "D", semi: 2, sw: 1.3, yPct: 44 },
        { name: "A", semi: 9, sw: 1.9, yPct: 63 },
        { name: "E", semi: 4, sw: 2.5, yPct: 82 },
      ];
      function getStrings() {
        return curStrings === 5 ? STRINGS_5 : STRINGS_4;
      }

      // ── Low Interval Limit (LIL) ─────────────────────────────────────────────────
      // Reference: A2 = MIDI 45 (A string open on a 4-string bass).
      // The "danger zone" for 3rds (3–4 semitones) is below MIDI 50 (= A string fret 5, ≈ D3).
      // For our system, each string's open pitch in MIDI:
      //   E1=28, A1=33, D2=38, G2=43, C3=48 (Hi-C 5-string)
      // We map {strName → midiOpen} for LIL evaluation.
      const STRING_MIDI = { E: 28, A: 33, D: 38, G: 43, C: 48 };
      // LIL threshold: lower note of a 3rd must be at MIDI >= 50 (A-string fret 5 ≈ D3)
      const LIL_MIDI_THRESHOLD = 50;

      function lilCheck(fretsOnStrings) {
        // Build list of {midiAbs, role} for each placed note
        const notes = fretsOnStrings
          .filter((x) => x.fret !== null && x.fret !== undefined)
          .map((x) => {
            const midiOpen = STRING_MIDI[x.strObj?.name] ?? 33;
            return {
              midi: midiOpen + x.fret,
              role: x.role,
              strName: x.strObj?.name,
            };
          })
          .sort((a, b) => a.midi - b.midi);

        for (let i = 0; i < notes.length - 1; i++) {
          const lo = notes[i],
            hi = notes[i + 1];
          const interval = hi.midi - lo.midi;
          if (interval >= 3 && interval <= 4) {
            // Minor/Major 3rd below LIL threshold
            if (lo.midi < LIL_MIDI_THRESHOLD) {
              return {
                violation: true,
                interval,
                loMidi: lo.midi,
                loStr: lo.strName,
              };
            }
          }
        }
        return { violation: false };
      }

      // ── Chord tone extraction from DATA ────────────────────────────────────────
      // Map chord quality strings to interval sets {semi offset from root, role}
      const CHORD_INTERVALS = {
        maj7: [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 11, r: "7th" },
        ],
        maj9: [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 11, r: "7th" },
          { s: 2, r: "tension" },
        ],
        maj13: [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 11, r: "7th" },
          { s: 9, r: "tension" },
        ],
        "maj7#11": [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 11, r: "7th" },
          { s: 6, r: "tension" },
        ],
        6: [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 9, r: "tension" },
        ],
        "6/9": [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 9, r: "tension" },
          { s: 2, r: "tension" },
        ],
        add9: [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 2, r: "tension" },
        ],
        m7: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 10, r: "7th" },
        ],
        min7: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 10, r: "7th" },
        ],
        m9: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 2, r: "tension" },
        ],
        m11: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 5, r: "tension" },
        ],
        m13: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 9, r: "tension" },
        ],
        m6: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 9, r: "tension" },
        ],
        "m6/9": [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 9, r: "tension" },
          { s: 2, r: "tension" },
        ],
        mmaj7: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 11, r: "7th" },
        ],
        madd9: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 2, r: "tension" },
        ],
        m7b5: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 6, r: "5th" },
          { s: 10, r: "7th" },
        ],
        ø: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 6, r: "5th" },
          { s: 10, r: "7th" },
        ],
        7: [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 7, r: "5th" },
          { s: 10, r: "7th" },
        ],
        9: [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 2, r: "tension" },
        ],
        13: [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 9, r: "tension" },
        ],
        "7sus4": [
          { s: 0, r: "root" },
          { s: 5, r: "tension" },
          { s: 7, r: "5th" },
          { s: 10, r: "7th" },
        ],
        "7b9": [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 1, r: "tension" },
        ],
        "7#9": [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 3, r: "tension" },
        ],
        "7b13": [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 8, r: "tension" },
        ],
        "7#11": [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 6, r: "tension" },
        ],
        "7alt": [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 10, r: "7th" },
          { s: 3, r: "tension" },
        ],
        dim7: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 6, r: "5th" },
          { s: 9, r: "7th" },
        ],
        dim: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 6, r: "5th" },
        ],
        aug: [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 8, r: "5th" },
        ],
        sus2: [
          { s: 0, r: "root" },
          { s: 2, r: "tension" },
          { s: 7, r: "5th" },
        ],
        sus4: [
          { s: 0, r: "root" },
          { s: 5, r: "tension" },
          { s: 7, r: "5th" },
        ],
        5: [
          { s: 0, r: "root" },
          { s: 7, r: "5th" },
        ],
        "": [
          { s: 0, r: "root" },
          { s: 4, r: "3rd" },
          { s: 7, r: "5th" },
        ],
        m: [
          { s: 0, r: "root" },
          { s: 3, r: "3rd" },
          { s: 7, r: "5th" },
        ],
      };

      function parseChordInput(str, contextKey) {
        // Returns {rootSemi, rootName, quality, intervals:[{semi(abs),role}], name}
        // PRIORITY: letter names FIRST (E, A, D, G, B, F etc.) to avoid C→Roman confusion
        str = str.trim();

        const roman = {
          I: 0,
          II: 2,
          III: 4,
          IV: 5,
          V: 7,
          VI: 9,
          VII: 11,
          i: 0,
          ii: 2,
          iii: 4,
          iv: 5,
          v: 7,
          vi: 9,
          vii: 11,
          bII: 1,
          bIII: 3,
          bVI: 8,
          bVII: 10,
        };

        let rootSemi, quality, rootName;

        // ── Step 1: Try letter-based name first (highest priority) ──
        const letterMatch = str.match(/^([A-G][#b]?)(.*)/);
        const romanMatch = str.match(
          /^(b?(?:VII|VI|IV|III|II|I|vii|vi|iv|iii|ii|V|v|I|i))(.*)/,
        );

        if (letterMatch) {
          // Letter match wins unless it's ambiguous and Roman is longer
          rootName = letterMatch[1];
          rootSemi = N2S[rootName] ?? 0;
          quality = letterMatch[2];
        } else if (romanMatch && roman[romanMatch[1]] !== undefined) {
          const keySemi = N2S[contextKey] || 0;
          rootSemi = (((roman[romanMatch[1]] + keySemi) % 12) + 12) % 12;
          quality = romanMatch[2];
          rootName = enharmonic(rootSemi, contextKey);
        } else {
          return null;
        }

        // ── Step 2: Quality normalization — ordered longest-match first ──
        const QUALITY_ORDER = [
          "maj7#11",
          "maj13",
          "maj9",
          "maj7",
          "mmaj7",
          "madd9",
          "m7b5",
          "m6/9",
          "m13",
          "m11",
          "m9",
          "m7",
          "m6",
          "min7",
          "add9",
          "6/9",
          "7sus4",
          "7#11",
          "7#9",
          "7b9",
          "7b13",
          "7alt",
          "dim7",
          "dim",
          "aug",
          "sus2",
          "sus4",
          "ø",
          "5",
          "m",
          "13",
          "9",
          "7",
          "6",
          "",
        ];

        let intervals = null;
        // Exact match
        for (const k of QUALITY_ORDER) {
          if (quality === k) {
            intervals = CHORD_INTERVALS[k];
            break;
          }
        }
        // Case-insensitive fallback
        if (!intervals) {
          for (const k of Object.keys(CHORD_INTERVALS)) {
            if (quality.toLowerCase() === k.toLowerCase()) {
              intervals = CHORD_INTERVALS[k];
              break;
            }
          }
        }
        if (!intervals) intervals = CHORD_INTERVALS[""];

        const tones = intervals.map((iv) => ({
          semi: (rootSemi + iv.s) % 12,
          role: iv.r,
          offset: iv.s,
        }));
        return { rootSemi, rootName, quality, tones, name: rootName + quality };
      }

      // ── Voice Leading Engine ────────────────────────────────────────────────────
      // For each chord, generate candidate voicings on the bass (3-4 notes, within 4-fret span)
      // Then pick the sequence with minimum total movement

      function fretOf(noteSemi, stringSemi) {
        return (((noteSemi - stringSemi) % 12) + 12) % 12;
      }

      // ── Professional Voicing Generator (Janek/Hadrien style) ────────────────────
      // KEY DESIGN PRINCIPLES:
      //  1. No rootFret match restriction — any chord tone can start the voicing
      //  2. Open strings (fret 0) allowed and excluded from 4-fret span calculation
      //  3. Target register: frets 5–15 (prioritized), fall back to 2–15
      //  4. LIL enforcement: 3rds below LIL_MIDI_THRESHOLD → auto-pivot to 10ths or shells
      //  5. Upper-string (G, C) voicings packed tightly (closed voicing for R&B gloss)
      //  6. Shell voicings: Root + 7th as fallback or explicit algo

      function generateVoicings(chord, algo, strings) {
        const { rootSemi, tones } = chord;

        const guideTones = tones.filter(
          (t) => t.role === "3rd" || t.role === "7th",
        );
        const tensions = tones.filter((t) => t.role === "tension");
        const fifth = tones.find((t) => t.role === "5th");

        // String layers — hi strings carry guide tones & tensions
        const is5 = strings.length === 5;
        // hiStrings = C and G (or just G on 4-string)
        const hiStrings = is5
          ? strings.filter((s) => s.name === "C" || s.name === "G")
          : strings.filter((s) => s.name === "G");
        const loStrings = strings.filter((s) => !hiStrings.includes(s));

        // Helper: MIDI absolute pitch for a placed note
        function midiAbs(strName, fret) {
          return (STRING_MIDI[strName] ?? 33) + fret;
        }

        // Helper: build a voiced set from a starting-note anchor on any string
        function buildVoicing(
          anchorStr,
          anchorFret,
          anchorTone,
          remainingTones,
          allStrings,
        ) {
          const placed = [
            {
              strObj: anchorStr,
              fret: anchorFret,
              semi: anchorTone.semi,
              role: anchorTone.role,
            },
          ];
          let usedStrings = new Set([anchorStr.name]);

          // Try to place remaining tones on unused strings
          // Prefer higher strings for upper tones
          const toPlace = [...remainingTones].sort(
            (a, b) => a.offset - b.offset,
          );
          // preferred string order: try hi strings for higher-offset tones
          const strOrder = [
            ...hiStrings.filter((s) => !usedStrings.has(s.name)),
            ...loStrings.filter((s) => !usedStrings.has(s.name)),
          ];

          for (const tone of toPlace) {
            for (const str of strOrder) {
              if (usedStrings.has(str.name)) continue;
              // Try this note on this string in multiple octaves
              let bestFret = null,
                bestScore = Infinity;
              for (let oct = 0; oct < 3; oct++) {
                const rawFret = fretOf(tone.semi, str.semi);
                const fret = rawFret + oct * 12;
                if (fret < 0 || fret > 15) continue;
                // Compute span with open strings excluded
                const allFrets = [...placed.map((p) => p.fret), fret].filter(
                  (f) => f > 0,
                );
                const span =
                  allFrets.length > 0
                    ? Math.max(...allFrets) - Math.min(...allFrets)
                    : 0;
                if (span > 4) continue;
                // Score: prefer register 5–15
                const midi = midiAbs(str.name, fret);
                const regScore = Math.abs(midi - 55); // centre around D3 area
                if (regScore < bestScore) {
                  bestScore = regScore;
                  bestFret = fret;
                }
              }
              if (bestFret !== null) {
                placed.push({
                  strObj: str,
                  fret: bestFret,
                  semi: tone.semi,
                  role: tone.role,
                });
                usedStrings.add(str.name);
                strOrder.splice(strOrder.indexOf(str), 1);
                break;
              }
            }
          }
          return placed;
        }

        // Helper: compute fret span (open strings=0 excluded)
        function spanOf(placed) {
          const frets = placed.map((p) => p.fret).filter((f) => f > 0);
          if (frets.length < 2) return 0;
          return Math.max(...frets) - Math.min(...frets);
        }

        // Helper: lowest MIDI pitch in voicing
        function lowestMidi(placed) {
          return Math.min(...placed.map((p) => midiAbs(p.strObj.name, p.fret)));
        }
        // Helper: highest MIDI pitch in voicing (top voice)
        function highestMidi(placed) {
          return Math.max(...placed.map((p) => midiAbs(p.strObj.name, p.fret)));
        }

        let voicings = [];

        // ── Shell Voicing builder (Root + 7th, optionally 3rd) ──
        function buildShell() {
          const shellTones = tones.filter(
            (t) => t.role === "root" || t.role === "7th" || t.role === "3rd",
          );
          for (const anchorStr of [...loStrings, ...hiStrings]) {
            for (let fret = 2; fret <= 14; fret++) {
              const rootFret = fretOf(rootSemi, anchorStr.semi);
              const candidates = [rootFret, rootFret + 12].filter(
                (f) => f >= 2 && f <= 14,
              );
              for (const rf of candidates) {
                if (Math.abs(rf - fret) > 2) continue;
                const anchored = { semi: rootSemi, role: "root", offset: 0 };
                const rest = shellTones.filter((t) => t.role !== "root");
                const pl = buildVoicing(anchorStr, rf, anchored, rest, strings);
                if (pl.length >= 2 && spanOf(pl) <= 4) voicings.push(pl);
              }
            }
          }
        }

        // ── Full voicing builder: anchor ANY chord tone on ANY string ──
        function buildFull() {
          const allTones = [...tones];
          for (const anchorTone of allTones) {
            for (const anchorStr of strings) {
              // Try this tone on this string at all viable frets (incl. open = 0)
              for (let oct = 0; oct < 3; oct++) {
                const rawFret = fretOf(anchorTone.semi, anchorStr.semi);
                const anchorFret = rawFret + oct * 12;
                if (anchorFret < 0 || anchorFret > 15) continue;

                const rest = allTones.filter((t) => t !== anchorTone);
                const pl = buildVoicing(
                  anchorStr,
                  anchorFret,
                  anchorTone,
                  rest,
                  strings,
                );
                if (pl.length < 2) continue;
                if (spanOf(pl) > 4) continue;

                // ── LIL check ──
                let lilViolation = false;
                if (curLIL) {
                  const lilIn = pl.map((p) => ({
                    strObj: p.strObj,
                    fret: p.fret,
                    noteSemi: p.semi,
                    role: p.role,
                  }));
                  if (lilCheck(lilIn).violation) lilViolation = true;
                }

                // ── Hadrien 10th auto-pivot ──
                // If LIL violation AND we're in shell/stepwise mode, replace the 3rd with
                // a 10th (3rd one octave up) on a higher string
                if (lilViolation && algo !== "shell") {
                  const thirdTone = pl.find((p) => p.role === "3rd");
                  if (thirdTone) {
                    // Try to move the 3rd up an octave on a higher string
                    const altPl = pl.filter((p) => p !== thirdTone);
                    const higherStr = hiStrings.find(
                      (s) => !altPl.some((p) => p.strObj.name === s.name),
                    );
                    if (higherStr) {
                      const newFret = fretOf(thirdTone.semi, higherStr.semi);
                      if (newFret >= 0 && newFret <= 15) {
                        altPl.push({
                          strObj: higherStr,
                          fret: newFret,
                          semi: thirdTone.semi,
                          role: thirdTone.role,
                        });
                        if (spanOf(altPl) <= 4) {
                          voicings.push({
                            placed: altPl,
                            lilViolation: false,
                            is10th: true,
                          });
                          continue;
                        }
                      }
                    }
                  }
                }

                voicings.push({ placed: pl, lilViolation, is10th: false });
              }
            }
          }
        }

        if (algo === "shell") {
          buildShell();
          // Wrap raw placed arrays
          voicings = voicings.map((pl) =>
            Array.isArray(pl)
              ? { placed: pl, lilViolation: false, is10th: false }
              : pl,
          );
        } else {
          buildFull();
          // Also add shells as fallback candidates
          buildShell();
          voicings = voicings.map((pl) =>
            Array.isArray(pl)
              ? { placed: pl, lilViolation: false, is10th: false }
              : pl,
          );
        }

        // Remove ghost voicings: must have at least root or a guide tone
        voicings = voicings.filter((v) => {
          const roles = new Set(v.placed.map((p) => p.role));
          return roles.has("root") || (roles.has("3rd") && roles.has("7th"));
        });

        // Deduplicate by fret fingerprint
        const seen = new Set();
        voicings = voicings.filter((v) => {
          const sig = v.placed
            .map((p) => `${p.strObj.name}:${p.fret}`)
            .sort()
            .join("|");
          if (seen.has(sig)) return false;
          seen.add(sig);
          return true;
        });

        // ── Prefer clean LIL voicings; fall back to flagged if none clean ──
        const clean = voicings.filter((v) => !v.lilViolation);
        let pool = clean.length > 0 ? clean : voicings;

        // ── Score voicings: prioritize frets 5–15, tight span, prefer hi-register for G/C ──
        pool.forEach((v) => {
          const frets = v.placed.map((p) => p.fret);
          const lo = Math.min(...frets.filter((f) => f > 0), 99);
          const hi = Math.max(...frets, 0);
          const span = spanOf(v.placed);
          // Register score: penalize below fret 5 or above fret 15
          const regPenalty =
            (lo < 5 ? Math.max(0, 5 - lo) * 2 : 0) +
            (hi > 15 ? Math.max(0, hi - 15) * 3 : 0);
          // Bonus for having notes on G/C strings (upper register color)
          const hiBonus =
            -v.placed.filter(
              (p) => p.strObj.name === "G" || p.strObj.name === "C",
            ).length * 1.5;
          // Prefer more chord tones covered
          const coverBonus = -v.placed.length * 0.5;
          v._score =
            span * 1.5 +
            regPenalty +
            hiBonus +
            coverBonus +
            (v.is10th ? -2 : 0);
        });
        pool.sort((a, b) => a._score - b._score);

        // Attach metadata for voice leading
        pool.forEach((v) => {
          const frets = v.placed.map((p) => p.fret);
          v.span = spanOf(v.placed);
          v.lowestFret = Math.min(...frets);
          v.highestMidi = highestMidi(v.placed);
          v.lowestMidi = lowestMidi(v.placed);
        });

        return pool.slice(0, 10);
      }

      // ── Professional Voice Leading Score Engine ──────────────────────────────────
      // Three pillars of Janek/Hadrien style:
      //   1. TOP VOICE MELODIC MOTION: top note moves by ≤2 semitones when possible
      //   2. TOTAL FINGER MOTION: minimize cumulative movement of all voices (DP)
      //   3. COMMON TONE BONUS: reward held tones (zero movement)

      function voiceLeadScore(prevVoicing, nextVoicing, algo) {
        const prevSemis = prevVoicing.placed.map((p) => p.semi);
        const nextSemis = nextVoicing.placed.map((p) => p.semi);

        // ── Total motion (path of least resistance) ──
        let totalMove = 0;
        for (const ns of nextSemis) {
          const bestMove = Math.min(
            ...prevSemis.map((ps) => semitoneDistance(ps, ns)),
          );
          totalMove += bestMove;
        }

        // ── Melodic top-voice bonus ──
        // The highest-pitched note (by MIDI) defines the melody
        const prevTopMidi = prevVoicing.highestMidi ?? 99;
        const nextTopMidi = nextVoicing.highestMidi ?? 99;
        const topMotion = Math.abs(nextTopMidi - prevTopMidi);
        // Strongly reward stepwise melody (0=common, 1=half, 2=whole = perfect)
        const topBonus =
          topMotion <= 2 ? -(3 - topMotion) * 3 : topMotion * 1.5;

        // ── Common tones bonus (zero-cost held notes) ──
        const prevSet = new Set(prevSemis);
        const ctCount = nextSemis.filter((s) => prevSet.has(s)).length;
        const ctBonus = ctCount * -2.5;

        // ── Prefer target register (frets 5-15) ──
        const lo = nextVoicing.lowestFret ?? 0;
        const regPenalty = lo < 5 ? Math.max(0, 5 - lo) * 1.5 : 0;

        // ── Shell algo: weight guide-tone resolution higher ──
        let shellBonus = 0;
        if (algo === "shell" || algo === "common") {
          const gt3 = prevVoicing.placed.find((p) => p.role === "3rd");
          const gt7 = prevVoicing.placed.find((p) => p.role === "7th");
          if (gt3) {
            const d = Math.min(
              ...nextSemis.map((n) => semitoneDistance(gt3.semi, n)),
            );
            if (d <= 1) shellBonus -= 3;
          }
          if (gt7) {
            const d = Math.min(
              ...nextSemis.map((n) => semitoneDistance(gt7.semi, n)),
            );
            if (d <= 1) shellBonus -= 3;
          }
        }

        return totalMove + topBonus + ctBonus + regPenalty + shellBonus;
      }

      function commonTones(v1, v2) {
        const s1 = new Set(v1.placed.map((p) => p.semi));
        const s2 = new Set(v2.placed.map((p) => p.semi));
        return [...s1].filter((s) => s2.has(s));
      }

      function optimizeProgression(chords, algo, strings) {
        // For each chord, get voicing candidates
        const candidates = chords.map((c) =>
          generateVoicings(c, algo, strings),
        );
        if (candidates.some((c) => c.length === 0)) return null;

        // Dynamic programming: find path minimizing total voice movement
        // Seed with a cost that prefers the register 5–15 (prefer voicings already scored lower)
        const n = chords.length;
        const dp = candidates[0].map((v, i) => ({
          cost: v._score ?? v.lowestFret,
          path: [i],
        }));

        for (let ci = 1; ci < n; ci++) {
          const newDp = candidates[ci].map((v, vi) => {
            let best = Infinity,
              bestPrev = 0;
            dp.forEach((prev, pi) => {
              const prevV = candidates[ci - 1][prev.path[prev.path.length - 1]];
              const score = voiceLeadScore(prevV, v, algo);
              const total = prev.cost + score;
              if (total < best) {
                best = total;
                bestPrev = pi;
              }
            });
            return { cost: best, path: [...dp[bestPrev].path, vi] };
          });
          dp.splice(0, dp.length, ...newDp);
        }

        // Find best final state
        let bestFinal = dp[0];
        for (const d of dp) if (d.cost < bestFinal.cost) bestFinal = d;

        // Build result
        return bestFinal.path.map((vi, ci) => ({
          chord: chords[ci],
          voicing: candidates[ci][vi],
          candidates: candidates[ci],
        }));
      }

      // ── Voice path arrows between chords ───────────────────────────────────────
      function buildVoicePaths(v1, v2) {
        const ct = new Set(commonTones(v1, v2));
        const paths = [];
        // Guide tone resolutions: 3rd → 7th, 7th → 3rd (tritone sub style)
        const gt1 = v1.placed.filter(
          (p) => p.role === "3rd" || p.role === "7th",
        );
        const notes2 = v2.placed;
        for (const g of gt1) {
          const closest = notes2.reduce(
            (best, n) => {
              const d = semitoneDistance(g.semi, n.semi);
              return d < best.d ? { n, d } : best;
            },
            { n: null, d: 999 },
          );
          if (closest.d <= 2) {
            const isCommon = ct.has(g.semi) && ct.has(closest.n.semi);
            const type = isCommon ? "ct" : g.role === "3rd" ? "37" : "73";
            paths.push({ from: g, to: closest.n, type, semis: closest.d });
          }
        }
        return paths;
      }

      // ── Fretboard SVG renderer ─────────────────────────────────────────────────
      const FB_FILL = {
        root: "#378ADD",
        "3rd": "#4a8c1a",
        "7th": "#c07820",
        tension: "#7a60d8",
        "5th": "#555550",
      };
      const ROLE_CLASS = {
        root: "n-root",
        "3rd": "n-3rd",
        "7th": "n-7th",
        tension: "n-tension",
        "5th": "n-5th",
      };

      // Interval label inside note circle (Hadrien 10th style)
      const ROLE_LABEL = {
        root: "R",
        "3rd": "3",
        "7th": "7",
        tension: "T",
        "5th": "5",
      };

      // Derive a richer interval label from semi offset vs root
      function intervalLabel(noteSemi, chord) {
        // chord may be null in ref view — fall back to role label
        if (!chord) return null;
        const diff = (((noteSemi - chord.rootSemi) % 12) + 12) % 12;
        const MAP = {
          0: "R",
          1: "b9",
          2: "9",
          3: "b3",
          4: "3",
          5: "11",
          6: "#11",
          7: "5",
          8: "b13",
          9: "13",
          10: "b7",
          11: "Δ7",
        };
        return MAP[diff] || "?";
      }

      function makeFretSVG(
        placed,
        strings,
        commonSemis = new Set(),
        highlightPaths = [],
        compact = false,
        chordCtx = null,
      ) {
        // ── Dynamic fret window ──────────────────────────────────────────────────
        const PAD = 20; // safety padding around SVG

        // Collect all non-open frets to determine window
        const usedFrets = placed.map((p) => p.fret).filter((f) => f > 0);
        let fretMin = usedFrets.length ? Math.min(...usedFrets) : 1;
        let fretMax = usedFrets.length ? Math.max(...usedFrets) : 5;

        // Always show at least a 4-fret window; expand for wide voicings
        const naturalSpan = fretMax - fretMin;
        const windowSize = Math.max(4, naturalSpan + 1);
        // Start window one fret before lowest note (but never < 1)
        const winStart = Math.max(1, fretMin - 1);
        const winEnd = winStart + windowSize;

        // If any open strings present, include nut (fret 0) in view
        const hasOpen = placed.some((p) => p.fret === 0);

        // ── Geometry ─────────────────────────────────────────────────────────────
        const NStr = strings.length;
        const STR_STEP = compact ? 20 : 26; // vertical spacing per string
        const NR = compact ? 8 : 12; // note circle radius
        const FS = compact ? 7.5 : 10; // fret number font size
        const FH = compact ? 7 : 9.5; // note label font height

        const LABEL_ZONE = compact ? 22 : 28; // left zone for string names
        const NUT_ZONE = hasOpen ? (compact ? 18 : 22) : 0; // extra space before nut for open-string dots
        const FRET_STEP = compact ? 32 : 50; // pixels per fret
        const MARKER_ZONE = compact ? 0 : 22; // bottom zone for fret markers

        const nFrets = winEnd - winStart + 1;
        const W = PAD * 2 + LABEL_ZONE + NUT_ZONE + nFrets * FRET_STEP;
        const H = PAD * 2 + NStr * STR_STEP + MARKER_ZONE;

        // String y coordinates — perfectly centered
        const strTop = PAD;
        const strBottom = PAD + (NStr - 1) * STR_STEP;
        function strY(i) {
          return strTop + i * STR_STEP;
        }

        // X coordinate for a given fret
        function fretX(f) {
          if (f === 0) {
            // Place open-string dot to the left of nut
            const openOffset = compact ? 9 : 11;
            return PAD + LABEL_ZONE + NUT_ZONE - openOffset;
          }
          // fret f is relative to window
          const slot = f - winStart; // 0-based slot
          return PAD + LABEL_ZONE + NUT_ZONE + (slot + 0.5) * FRET_STEP;
        }
        function fretLineX(f) {
          const slot = f - winStart;
          return PAD + LABEL_ZONE + NUT_ZONE + slot * FRET_STEP;
        }

        const LC = "rgba(255,255,255,.13)";
        const TC = "#5a5a52";
        const NC = "rgba(255,255,255,.5)";
        const MC = "rgba(255,255,255,.09)";

        // ── SVG body ──────────────────────────────────────────────────────────────
        const gridTop = strTop - STR_STEP * 0.35;
        const gridBot = strBottom + STR_STEP * 0.35;

        let body = "";

        // ── Fret lines (window only) ──────────────────────────────────────────────
        for (let f = winStart; f <= winEnd + 1; f++) {
          const x = fretLineX(f);
          const isFirst = f === winStart;
          // Draw the nut-style bar for first fret in window (visual anchor)
          body += `<line x1="${x}" y1="${gridTop}" x2="${x}" y2="${gridBot}" stroke="${isFirst ? NC : LC}" stroke-width="${isFirst ? 2 : 0.7}"/>`;
        }

        // ── Nut / open-string zone ────────────────────────────────────────────────
        if (hasOpen) {
          const nutX = PAD + LABEL_ZONE + NUT_ZONE - 2;
          body += `<line x1="${nutX}" y1="${gridTop}" x2="${nutX}" y2="${gridBot}" stroke="${NC}" stroke-width="3" stroke-linecap="round"/>`;
        }

        // ── Fret markers (dots) — only for standard positions in window ──────────
        if (!compact) {
          const MARKER_FRETS = [3, 5, 7, 9, 12, 15, 17];
          const DOUBLE = [12];
          MARKER_FRETS.forEach((f) => {
            if (f < winStart || f > winEnd) return;
            const mx = fretX(f);
            const my = H - MARKER_ZONE * 0.45;
            if (DOUBLE.includes(f)) {
              body += `<circle cx="${mx - 7}" cy="${my}" r="3" fill="${MC}"/>`;
              body += `<circle cx="${mx + 7}" cy="${my}" r="3" fill="${MC}"/>`;
            } else {
              body += `<circle cx="${mx}" cy="${my}" r="3" fill="${MC}"/>`;
            }
            body += `<text x="${mx}" y="${H - 4}" text-anchor="middle" font-size="${FS}" fill="${TC}" font-family="Space Mono,monospace">${f}</text>`;
          });
        }

        // ── Strings ───────────────────────────────────────────────────────────────
        const xLineEnd = PAD + LABEL_ZONE + NUT_ZONE + nFrets * FRET_STEP;
        strings.forEach((str, i) => {
          const y = strY(i);
          body += `<line x1="${PAD + LABEL_ZONE}" y1="${y}" x2="${xLineEnd}" y2="${y}" stroke="${LC}" stroke-width="${str.sw}"/>`;
          body += `<text x="${PAD + LABEL_ZONE - 4}" y="${y + 3.5}" text-anchor="end" font-size="${compact ? 8 : 10}" font-weight="600" fill="${TC}" font-family="Space Mono,monospace">${str.name}</text>`;
        });

        // ── Place notes ────────────────────────────────────────────────────────────
        placed.forEach((p) => {
          const si = strings.findIndex((s) => s.name === p.strObj.name);
          if (si < 0) return;
          // Skip notes outside the view window (except open)
          if (p.fret > 0 && (p.fret < winStart || p.fret > winEnd)) return;

          const cx = fretX(p.fret);
          const cy = strY(si);
          const isCommon = commonSemis.has(p.semi);
          const fill = FB_FILL[p.role] || "#666";
          const glowAttr = isCommon ? 'filter="url(#ctglow)"' : "";

          // Outer glow ring for common tones
          if (isCommon) {
            body += `<circle cx="${cx}" cy="${cy}" r="${NR + 5}" fill="none" stroke="#f5c842" stroke-width="1.5" opacity=".55"/>`;
            body += `<circle cx="${cx}" cy="${cy}" r="${NR + 9}" fill="none" stroke="#f5c842" stroke-width=".5" opacity=".25"/>`;
          }

          body += `<circle cx="${cx}" cy="${cy}" r="${NR}" fill="${fill}" stroke="${isCommon ? "#f5c842" : "rgba(255,255,255,.35)"}" stroke-width="${isCommon ? 2 : 1}" ${glowAttr}/>`;

          // Interval label inside circle
          const lbl = chordCtx
            ? intervalLabel(p.semi, chordCtx)
            : enharmonic(p.semi, curKey);
          body += `<text x="${cx}" y="${cy + FH * 0.38}" text-anchor="middle" dominant-baseline="middle" font-size="${FH}" font-weight="700" fill="white" font-family="Space Mono,monospace">${lbl}</text>`;
        });

        // ── Assemble final SVG with defs ──────────────────────────────────────────
        const defs = `<defs>
    <filter id="ctglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

        return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;display:block">${defs}${body}</svg>`;
      }

      function makePosFull(placed, strings, lilViolation) {
        const strNames = strings.map((s) => s.name);
        let h = `<div class="pos-wrap"><table class="pos-table"><thead><tr><th>Note</th><th>Role</th>`;
        strNames.forEach((n) => (h += `<th>${n}</th>`));
        h += `</tr></thead><tbody>`;
        // Collect unique semis
        const seen = new Set();
        const rows = [];
        placed.forEach((p) => {
          if (!seen.has(p.semi)) {
            seen.add(p.semi);
            rows.push(p);
          }
        });
        rows.forEach((p) => {
          const noteName = enharmonic(p.semi, curKey);
          const frets = strings.map((st) => {
            const f = fretOf(p.semi, st.semi);
            const isPlaced = placed.some(
              (pp) => pp.strObj.name === st.name && pp.semi === p.semi,
            );
            return { f, isPlaced };
          });
          const minF = Math.min(...frets.map((x) => x.f));
          h += `<tr><td><span class="pill ${ROLE_CLASS[p.role] || "n-5th"}">${noteName}</span></td><td style="font-size:10px;color:var(--text3);font-family:'Space Mono',monospace">${p.role}</td>`;
          frets.forEach(({ f, isPlaced }) => {
            const best = f === minF;
            // LIL check for this note on this string
            const strObj =
              strings.find((st) => fretOf(p.semi, st.semi) === f) || {};
            h += `<td class="${best ? "best" : ""}">${f === 0 ? `<span class="open-lbl">open</span>` : `fret ${f}`}${best ? '<span class="star">★</span>' : ""}</td>`;
          });
          h += `</tr>`;
        });
        h += `</tbody></table></div>`;
        if (lilViolation)
          h += `<div style="margin-top:.4rem"><span class="lil-warn">⚠ LIL: 3rd interval below recommended register — consider open voicing or 10th</span></div>`;
        return h;
      }

      // ── Chord function labels ───────────────────────────────────────────────────
      function midiAbsOf(p) {
        return (STRING_MIDI[p.strObj?.name] ?? 33) + p.fret;
      }
      function guessFunction(chord, contextKey) {
        const diff = (chord.rootSemi - (N2S[contextKey] || 0) + 12) % 12;
        const q = chord.quality;
        if (diff === 0 && (q.includes("maj7") || q === "" || q === "maj9"))
          return "Imaj7 — Tonic";
        if (diff === 2 && (q === "m7" || q === "min7"))
          return "iim7 — Subdominant";
        if (
          diff === 7 &&
          (q === "7" || q === "9" || q === "13" || q.startsWith("7"))
        )
          return "V7 — Dominant";
        if (diff === 9 && (q === "m7" || q === "min7")) return "vim7 — Tonic";
        if (diff === 5 && (q.includes("maj7") || q === ""))
          return "IVmaj7 — Subdominant";
        return chord.name;
      }

      // ── Render Voice Leading Progression ───────────────────────────────────────
      function renderProgression(input) {
        const parts = input
          .trim()
          .split(/[\s\-–—,]+/)
          .filter(Boolean);
        if (parts.length < 2) {
          document.getElementById("progResult").innerHTML =
            `<div style="padding:1rem;color:var(--lil-warn);font-family:'Space Mono',monospace;font-size:12px">⚠ Enter at least 2 chords</div>`;
          document.getElementById("progResult").style.display = "block";
          return;
        }
        const chords = parts
          .map((p) => parseChordInput(p, curKey))
          .filter(Boolean);
        if (chords.length < 2) {
          document.getElementById("progResult").innerHTML =
            `<div style="padding:1rem;color:var(--lil-warn);font-family:'Space Mono',monospace;font-size:12px">⚠ Could not parse chords. Try: Dm7 G7 Cmaj7</div>`;
          document.getElementById("progResult").style.display = "block";
          return;
        }
        const strings = getStrings();
        const result = optimizeProgression(chords, curAlgo, strings);
        if (!result) {
