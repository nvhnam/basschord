<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bass Chord Reference — 12 Keys</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #f7f6f2;
        --surface: #fff;
        --border: rgba(0, 0, 0, 0.1);
        --border-l: rgba(0, 0, 0, 0.06);
        --text: #1a1a18;
        --text2: #5a5955;
        --text3: #8a8985;
        --accent: #4a47d0;
        --accent-bg: #eeedfe;
        --accent-fg: #3c3489;
        --n-rb: #e6f1fb;
        --n-rf: #0c447c;
        --n-3b: #eaf3de;
        --n-3f: #3b6d11;
        --n-7b: #faeeda;
        --n-7f: #633806;
        --n-tb: #eeedfe;
        --n-tf: #3c3489;
        --n-5b: #f1efe8;
        --n-5f: #5f5e5a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a18;
          --surface: #252523;
          --border: rgba(255, 255, 255, 0.1);
          --border-l: rgba(255, 255, 255, 0.06);
          --text: #f0efe9;
          --text2: #a0a09a;
          --text3: #606058;
          --accent: #9b98f0;
          --accent-bg: #26215c;
          --accent-fg: #cecbf6;
          --n-rb: #042c53;
          --n-rf: #b5d4f4;
          --n-3b: #173404;
          --n-3f: #c0dd97;
          --n-7b: #412402;
          --n-7f: #fac775;
          --n-tb: #26215c;
          --n-tf: #cecbf6;
          --n-5b: #2c2c2a;
          --n-5f: #b4b2a9;
        }
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .header {
        background: var(--surface);
        border-bottom: 0.5px solid var(--border);
        padding: 1.1rem 1.5rem 0.8rem;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 0.9rem;
        flex-wrap: wrap;
      }
      .header-top h1 {
        font-size: 16px;
        font-weight: 500;
      }
      .tab-bar {
        display: flex;
        gap: 4px;
      }
      .tab-btn {
        font-size: 12px;
        font-weight: 500;
        padding: 5px 14px;
        border: 0.5px solid var(--border);
        border-radius: 20px;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.13s;
        letter-spacing: 0.04em;
      }
      .tab-btn:hover {
        background: var(--bg);
        color: var(--text);
      }
      .tab-btn.active {
        background: var(--accent-bg);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      .key-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .key-btn {
        width: 44px;
        height: 38px;
        border: 0.5px solid var(--border);
        border-radius: 7px;
        background: transparent;
        color: var(--text2);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.13s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .key-btn:hover {
        background: var(--bg);
        color: var(--text);
      }
      .key-btn.active {
        background: var(--accent-bg);
        color: var(--accent-fg);
        border-color: var(--accent);
        font-weight: 600;
      }
      .key-btn.acc {
        font-size: 11px;
      }
      .controls {
        padding: 0.55rem 1.5rem;
        background: var(--surface);
        border-bottom: 0.5px solid var(--border-l);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .filter-label {
        font-size: 11px;
        color: var(--text3);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .filter-bar {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .fbtn {
        font-size: 12px;
        padding: 3px 11px;
        border: 0.5px solid var(--border);
        border-radius: 20px;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.13s;
      }
      .fbtn:hover {
        background: var(--bg);
        color: var(--text);
      }
      .fbtn.active {
        background: var(--bg);
        color: var(--text);
        font-weight: 500;
        border-color: var(--border);
      }
      .badge {
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 20px;
        background: var(--accent-bg);
        color: var(--accent-fg);
        font-weight: 500;
        margin-left: auto;
      }
      .content {
        padding: 1.2rem 1.5rem;
        max-width: 1280px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 13px;
        margin-bottom: 1.2rem;
        font-size: 12px;
        color: var(--text2);
      }
      .leg-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .leg-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .group-block {
        margin-bottom: 1.6rem;
      }
      .group-label {
        font-size: 11px;
        font-weight: 500;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.45rem;
        padding-bottom: 4px;
        border-bottom: 0.5px solid var(--border-l);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .grp-cnt {
        opacity: 0.5;
        font-weight: 400;
      }
      .ctable {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        background: var(--surface);
        border-radius: 9px;
        overflow: hidden;
        border: 0.5px solid var(--border);
      }
      .ctable th {
        text-align: left;
        font-weight: 500;
        font-size: 11px;
        color: var(--text2);
        padding: 7px 11px;
        border-bottom: 0.5px solid var(--border);
        background: var(--bg);
      }
      .ctable td {
        padding: 7px 11px;
        border-bottom: 0.5px solid var(--border-l);
        vertical-align: middle;
        color: var(--text);
      }
      .ctable tr:last-child td {
        border-bottom: none;
      }
      .ctable tbody tr:hover td {
        background: rgba(128, 128, 128, 0.04);
      }
      .cname {
        font-weight: 500;
        font-size: 14px;
        white-space: nowrap;
      }
      .caka {
        font-size: 11px;
        color: var(--text3);
        margin-top: 1px;
      }
      .cfm {
        color: var(--text2);
        font-size: 12px;
        white-space: nowrap;
      }
      .cnotes {
        font-family: "SF Mono", "Fira Code", "Consolas", monospace;
        font-size: 12px;
        color: var(--text2);
        white-space: nowrap;
      }
      .ctip {
        font-size: 12px;
        color: var(--text2);
        max-width: 230px;
      }
      .pills {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        min-width: 140px;
      }
      .pill {
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .n-root {
        background: var(--n-rb);
        color: var(--n-rf);
      }
      .n-3rd {
        background: var(--n-3b);
        color: var(--n-3f);
      }
      .n-7th {
        background: var(--n-7b);
        color: var(--n-7f);
      }
      .n-tension {
        background: var(--n-tb);
        color: var(--n-tf);
      }
      .n-5th {
        background: var(--n-5b);
        color: var(--n-5f);
      }
      .fb-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 10px;
        padding: 1rem 1.1rem;
        margin-bottom: 1rem;
      }
      .fb-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
        gap: 8px;
      }
      .fb-cname {
        font-size: 16px;
        font-weight: 500;
      }
      .fb-fm {
        font-size: 12px;
        color: var(--text2);
        margin-left: 8px;
      }
      .fb-fret {
        overflow-x: auto;
        margin: 0.75rem 0 0.6rem;
      }
      .pos-wrap {
        overflow-x: auto;
      }
      .pos-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        min-width: 380px;
      }
      .pos-table th {
        text-align: center;
        font-weight: 500;
        font-size: 11px;
        color: var(--text2);
        padding: 5px 8px;
        border-bottom: 0.5px solid var(--border);
        background: var(--bg);
      }
      .pos-table th:first-child {
        text-align: left;
      }
      .pos-table td {
        padding: 5px 8px;
        border-bottom: 0.5px solid var(--border-l);
        text-align: center;
        color: var(--text2);
        font-size: 12px;
      }
      .pos-table tr:last-child td {
        border-bottom: none;
      }
      .pos-table td:first-child {
        text-align: left;
      }
      .best {
        font-weight: 600;
        color: var(--text);
      }
      .open-lbl {
        font-size: 11px;
        font-style: italic;
        color: var(--text3);
      }
      .star {
        color: var(--accent-fg);
        margin-left: 2px;
        font-size: 11px;
      }
      @media (max-width: 800px) {
        .ctable th:nth-child(3),
        .ctable td:nth-child(3),
        .ctable th:nth-child(5),
        .ctable td:nth-child(5) {
          display: none;
        }
        .content {
          padding: 0.9rem;
        }
        .header {
          padding: 0.9rem 1rem 0.7rem;
        }
        .controls {
          padding: 0.45rem 1rem;
        }
      }
      @media (max-width: 540px) {
        .ctable th:nth-child(2),
        .ctable td:nth-child(2) {
          display: none;
        }
        .key-btn {
          width: 37px;
          height: 34px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-top">
        <h1>Bass Chord Reference</h1>
        <div class="tab-bar" id="tabBar">
          <button class="tab-btn active" data-tab="vie">VIE</button>
          <button class="tab-btn" data-tab="eng">ENG</button>
          <button class="tab-btn" data-tab="fretboard">FRETBOARD</button>
        </div>
      </div>
      <div class="key-row" id="keySelector"></div>
    </div>
    <div class="controls">
      <span class="filter-label" id="fltLbl">Nhóm:</span>
      <div class="filter-bar" id="filterBar"></div>
      <span class="badge" id="badge"></span>
    </div>
    <div class="content">
      <div class="legend" id="legend"></div>
      <div id="container"></div>
    </div>
    <script>
      // ── Enharmonic-correct note engine ─────────────────────────────────────────
      // Major scale for each key: 7 diatonic notes
      const MAJOR = {
        C: ["C", "D", "E", "F", "G", "A", "B"],
        Db: ["Db", "Eb", "F", "Gb", "Ab", "Bb", "C"],
        D: ["D", "E", "F#", "G", "A", "B", "C#"],
        Eb: ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
        E: ["E", "F#", "G#", "A", "B", "C#", "D#"],
        F: ["F", "G", "A", "Bb", "C", "D", "E"],
        "F#": ["F#", "G#", "A#", "B", "C#", "D#", "E#"],
        G: ["G", "A", "B", "C", "D", "E", "F#"],
        Ab: ["Ab", "Bb", "C", "Db", "Eb", "F", "G"],
        A: ["A", "B", "C#", "D", "E", "F#", "G#"],
        Bb: ["Bb", "C", "D", "Eb", "F", "G", "A"],
        B: ["B", "C#", "D#", "E", "F#", "G#", "A#"],
      };

      // Semitone lookup (for fretboard positions)
      const N2S = {
        C: 0,
        "C#": 1,
        Db: 1,
        D: 2,
        "D#": 3,
        Eb: 3,
        E: 4,
        "E#": 5,
        Fb: 4,
        F: 5,
        "F#": 6,
        Gb: 6,
        G: 7,
        "G#": 8,
        Ab: 8,
        A: 9,
        "A#": 10,
        Bb: 10,
        B: 11,
        "B#": 0,
        Cb: 11,
      };
      const FL = [
        "C",
        "Db",
        "D",
        "Eb",
        "E",
        "F",
        "Gb",
        "G",
        "Ab",
        "A",
        "Bb",
        "B",
      ];

      // Apply accidental to a base note name (theoretically correct)
      function applyAcc(note, acc) {
        if (!acc) return note;
        if (acc === "#") {
          if (note.endsWith("b")) return note.slice(0, -1); // Bb+# → B
          return note + "#"; // D+# → D#
        }
        if (acc === "b") {
          if (note.endsWith("#")) return note.slice(0, -1); // F#+b → F
          return note + "b"; // B+b → Bb
        }
        if (acc === "bb") {
          // Double flat: drop 2 semitones, use flat names
          const s = N2S[note];
          if (s === undefined) return note;
          return FL[(((s - 2) % 12) + 12) % 12];
        }
        return note;
      }

      // Get note name from interval: degree (1-7) + accidental ('','b','#','bb')
      function iNote(key, deg, acc) {
        const base = MAJOR[key][deg - 1];
        return applyAcc(base, acc);
      }

      // Semitone of an interval note (for fret calculation)
      function iSemi(key, deg, acc) {
        return N2S[iNote(key, deg, acc)];
      }

      // Transpose chord ROOT name (e.g. "Cm7" → "Gm7")
      // Uses correct enharmonic for the root based on key
      function tChordName(name, key) {
        if (name.includes(" / "))
          return name
            .split(" / ")
            .map((p) => tChordName(p, key))
            .join(" / ");
        const m = name.match(/^([A-G][#b]?)(.*)/);
        if (!m) return name;
        const oldRoot = m[1],
          quality = m[2];
        // Find which key this chord was originally in (C) and transpose
        // The new root IS the key name for the tonic chord; for others derive from interval
        // Simple approach: root = tNote by semitone using key's flat/sharp convention
        const FLAT_K = new Set(["F", "Bb", "Eb", "Ab", "Db", "Gb"]);
        const names = FLAT_K.has(key)
          ? FL
          : ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const semi = N2S[oldRoot];
        if (semi === undefined) return name;
        return names[(((semi + N2S[key || "C"]) % 12) + 12) % 12] + quality;
      }

      // Render all-notes string from ni array
      function renderNi(ni, key) {
        return ni.map(([d, a]) => iNote(key, d, a)).join("–");
      }

      // ── Chord Data ─────────────────────────────────────────────────────────────
      // b entries: {i:[degree, accidental], t:'n-xxx'}
      // ni: [[degree, accidental], ...] for all chord tones
      const DATA = [
        {
          group: "Triads",
          groupE: "Triads",
          cat: "triad",
          rows: [
            {
              name: "C",
              aka: "major",
              f: "1–3–5",
              ni: [
                [1, ""],
                [3, ""],
                [5, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [5, ""], t: "n-5th" },
              ],
              tip: "Root + 3rd + 5th. Đủ, sáng.",
              tipE: "Root, 3rd, 5th. Complete and bright.",
            },
            {
              name: "Cm",
              aka: "minor",
              f: "1–b3–5",
              ni: [
                [1, ""],
                [3, "b"],
                [5, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, "b"], t: "n-3rd" },
                { i: [5, ""], t: "n-5th" },
              ],
              tip: "b3 là màu sắc quan trọng nhất.",
              tipE: "b3 is the key color note for minor.",
            },
            {
              name: "Cdim",
              aka: "diminished",
              f: "1–b3–b5",
              ni: [
                [1, ""],
                [3, "b"],
                [5, "b"],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, "b"], t: "n-3rd" },
                { i: [5, "b"], t: "n-5th" },
              ],
              tip: "b5 rất căng — passing chord.",
              tipE: "b5 is very tense — best as a passing chord.",
            },
            {
              name: "Caug",
              aka: "augmented",
              f: "1–3–#5",
              ni: [
                [1, ""],
                [3, ""],
                [5, "#"],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [5, "#"], t: "n-5th" },
              ],
              tip: "#5 tạo cảm giác trôi nổi.",
              tipE: "#5 creates an unresolved, floating feel.",
            },
            {
              name: "Csus2",
              aka: "",
              f: "1–2–5",
              ni: [
                [1, ""],
                [2, ""],
                [5, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [2, ""], t: "n-tension" },
                { i: [5, ""], t: "n-5th" },
              ],
              tip: "Không 3rd → mơ hồ, hay dùng trong R&B.",
              tipE: "No 3rd → ambiguous quality, common in R&B.",
            },
            {
              name: "Csus4",
              aka: "",
              f: "1–4–5",
              ni: [
                [1, ""],
                [4, ""],
                [5, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [4, ""], t: "n-tension" },
                { i: [5, ""], t: "n-5th" },
              ],
              tip: "4th thay 3rd — cảm giác lơ lửng.",
              tipE: "4th replaces 3rd — suspended feel.",
            },
            {
              name: "C5",
              aka: "power chord",
              f: "1–5",
              ni: [
                [1, ""],
                [5, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [5, ""], t: "n-5th" },
              ],
              tip: "Rock/funk bass — đơn giản, mạnh mẽ.",
              tipE: "Rock/funk staple — simple and powerful.",
            },
          ],
        },
        {
          group: "Major 7th & biến thể",
          groupE: "Major 7th & Variations",
          cat: "maj7",
          rows: [
            {
              name: "Cmaj7",
              aka: "",
              f: "1–3–5–maj7",
              ni: [
                [1, ""],
                [3, ""],
                [5, ""],
                [7, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [7, ""], t: "n-7th" },
              ],
              tip: "Shell: Root–3–maj7. B rất sáng.",
              tipE: "Shell: Root–3–maj7. Maj7 is bright; use higher register.",
            },
            {
              name: "Cmaj9",
              aka: "",
              f: "1–3–5–maj7–9",
              ni: [
                [1, ""],
                [3, ""],
                [5, ""],
                [7, ""],
                [2, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [7, ""], t: "n-7th" },
                { i: [2, ""], t: "n-tension" },
              ],
              tip: "D (9th) thêm vào sau maj7 — rất R&B.",
              tipE: "9th layered over maj7 — classic R&B sound.",
            },
            {
              name: "Cmaj13",
              aka: "",
              f: "1–3–maj7–13",
              ni: [
                [1, ""],
                [3, ""],
                [7, ""],
                [6, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [7, ""], t: "n-7th" },
                { i: [6, ""], t: "n-tension" },
              ],
              tip: "13th = màu sắc lớp trên.",
              tipE: "13th adds an upper-register color tone.",
            },
            {
              name: "Cmaj7#11",
              aka: "Lydian",
              f: "1–3–maj7–#11",
              ni: [
                [1, ""],
                [3, ""],
                [7, ""],
                [4, "#"],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [7, ""], t: "n-7th" },
                { i: [4, "#"], t: "n-tension" },
              ],
              tip: "#11 = Lydian mode. Phảng phất, mơ mộng.",
              tipE: "#11 = Lydian mode. Dreamy and floating.",
            },
            {
              name: "Cmaj7#5",
              aka: "",

        const fbar = document.getElementById("filterBar");
        fbar.innerHTML = "";
        const filters = curTab === "eng" ? FILTERS_ENG : FILTERS_VIE;
        filters.forEach((f) => {
          const b = document.createElement("button");
          b.className = "fbtn" + (f.c === curFilter ? " active" : "");
          b.textContent = f.l;
          b.dataset.cat = f.c;
          b.onclick = () => {
            fbar
              .querySelectorAll(".fbtn")
              .forEach((x) => x.classList.remove("active"));
            b.classList.add("active");
            curFilter = f.c;
            render();
          };
          fbar.appendChild(b);
        });
        document.getElementById("fltLbl").textContent =
          curTab === "eng" ? "Group:" : "Nhóm:";
      }

      function buildLegend() {
        const isE = curTab === "eng";
        const items = isE
          ? [
              { c: "#378ADD", l: "Root (required)" },
              { c: "#639922", l: "3rd / b3 (quality)" },
              { c: "#BA7517", l: "7th / b7 / maj7 (color)" },
              { c: "#7F77DD", l: "Tension (9, 11, 13, alt)" },
              { c: "#888780", l: "5th (neutral)" },
            ]
          : [
              { c: "#378ADD", l: "Root (bắt buộc)" },
              { c: "#639922", l: "3rd / b3 (chất chord)" },
              { c: "#BA7517", l: "7th / b7 / maj7 (màu)" },
              { c: "#7F77DD", l: "Tension (9, 11, 13, alt)" },
              { c: "#888780", l: "5th (trung tính)" },
            ];
        document.getElementById("legend").innerHTML = items
          .map(
            (i) =>
              `<div class="leg-item"><div class="leg-dot" style="background:${i.c}"></div>${i.l}</div>`,
          )
          .join("");
      }

      // ── Get filtered groups ────────────────────────────────────────────────────
      function groups() {
        return curFilter === "all"
          ? DATA
          : DATA.filter((g) => g.cat === curFilter);
      }

      // ── Chord name transposition (root only, using correct key convention) ──────
      function tChord(name, key) {
        if (name.includes(" / "))
          return name
            .split(" / ")
            .map((p) => tChord(p, key))
            .join(" / ");
        const m = name.match(/^([A-G][#b]?)(.*)/);
        if (!m) return name;
        const FLAT_K = new Set(["F", "Bb", "Eb", "Ab", "Db", "Gb"]);
        const names = FLAT_K.has(key)
          ? FL
          : ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        // offset from C
        const rootSemi = N2S[m[1]];
        const keySemi = N2S[key];
        return names[(((rootSemi + keySemi) % 12) + 12) % 12] + m[2];
      }

      // ── Render: VIE / ENG table ────────────────────────────────────────────────
      function renderTable(lang) {
        const gs = groups();
        const total = gs.reduce((s, g) => s + g.rows.length, 0);
        document.getElementById("badge").textContent =
          total + (lang === "eng" ? " chords" : " hợp âm");
        let html = "";
        gs.forEach((g) => {
          const gname = lang === "eng" ? g.groupE : g.group;
          html += `<div class="group-block"><div class="group-label">${gname}<span class="grp-cnt">(${g.rows.length})</span></div>
    <table class="ctable"><thead><tr>
      <th style="width:105px">${lang === "eng" ? "Chord" : "Hợp âm"}</th>
      <th style="width:125px">${lang === "eng" ? "Formula" : "Công thức"}</th>
      <th>${lang === "eng" ? "All notes" : "Tất cả notes"}</th>
      <th style="width:200px">${lang === "eng" ? "3–4 bass notes" : "3–4 notes cho bass"}</th>
      <th>${lang === "eng" ? "Notes" : "Ghi chú"}</th>
    </tr></thead><tbody>`;
          g.rows.forEach((r) => {
            const cn = tChord(r.name, curKey);
            const ns = renderNi(r.ni, curKey);
            const ps = r.b
              .map(
                (b) =>
                  `<span class="pill ${b.t}">${iNote(curKey, b.i[0], b.i[1])}</span>`,
              )
              .join("");
            const tip = lang === "eng" ? r.tipE : r.tip;
            html += `<tr>
        <td><div class="cname">${cn}</div>${r.aka ? `<div class="caka">${r.aka}</div>` : ""}</td>
        <td class="cfm">${r.f}</td>
        <td class="cnotes">${ns}</td>
        <td><div class="pills">${ps}</div></td>
        <td class="ctip">${tip}</td>
      </tr>`;
          });
          html += `</tbody></table></div>`;
        });
        document.getElementById("container").innerHTML = html;
      }

      // ── Fretboard SVG ──────────────────────────────────────────────────────────
      const FB_STR = [
        { name: "G", deg: 5, acc: "", y: 18, sw: 0.8 },
        { name: "D", deg: 2, acc: "", y: 43, sw: 1.2 },
        { name: "A", deg: 6, acc: "", y: 68, sw: 1.8 },
        { name: "E", deg: 3, acc: "b", y: 93, sw: 2.4 },
      ];
      // Open string notes for standard tuning (E A D G) as intervals from C major:
      // E=3(C's 3rd=E? No — we need absolute semitones for string open notes)
      // Actually: open strings are absolute: E=4, A=9, D=2, G=7 semitones
      const FB_OPEN = [
        { name: "G", semi: 7, y: 18, sw: 0.8 },
        { name: "D", semi: 2, y: 43, sw: 1.2 },
        { name: "A", semi: 9, y: 68, sw: 1.8 },
        { name: "E", semi: 4, y: 93, sw: 2.4 },
      ];
      const FB_FILL = {
        "n-root": "#378ADD",
        "n-3rd": "#4a8c1a",
        "n-7th": "#c07820",
        "n-tension": "#6660cc",
        "n-5th": "#888780",
      };

      function dotX(fret) {
        return fret === 0 ? 22 : 40 + (fret - 0.5) * 55;
      }
      function fretLX(n) {
        return 40 + n * 55;
      }

      function makeFretSVG(bassNotes) {
        const dm = window.matchMedia("(prefers-color-scheme:dark)").matches;
        const LC = dm ? "rgba(255,255,255,.14)" : "rgba(0,0,0,.11)";
        const TC = dm ? "#707068" : "#888780";
        const NC = dm ? "rgba(255,255,255,.4)" : "rgba(0,0,0,.38)";
        const MC = dm ? "rgba(255,255,255,.10)" : "rgba(0,0,0,.07)";
        let s = `<svg viewBox="0 0 700 115" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">`;
        for (let f = 1; f <= 12; f++) {
          const x = fretLX(f);
          s += `<line x1="${x}" y1="8" x2="${x}" y2="98" stroke="${LC}" stroke-width="${f === 12 ? 1.5 : 0.7}"/>`;
        }
        s += `<line x1="40" y1="6" x2="40" y2="100" stroke="${NC}" stroke-width="3.5"/>`;
        [3, 5, 7, 9].forEach(
          (f) =>
            (s += `<circle cx="${dotX(f)}" cy="80" r="3.5" fill="${MC}"/>`),
        );
        s += `<circle cx="${dotX(12) - 8}" cy="80" r="3.5" fill="${MC}"/><circle cx="${dotX(12) + 8}" cy="80" r="3.5" fill="${MC}"/>`;
        [3, 5, 7, 9, 12].forEach(
          (f) =>
            (s += `<text x="${dotX(f)}" y="112" text-anchor="middle" font-size="9" fill="${TC}">${f}</text>`),
        );
        FB_OPEN.forEach((str) => {
          s += `<line x1="38" y1="${str.y}" x2="698" y2="${str.y}" stroke="${LC}" stroke-width="${str.sw}"/>`;
          s += `<text x="34" y="${str.y + 4}" text-anchor="end" font-size="10" font-weight="500" fill="${TC}">${str.name}</text>`;
        });
        bassNotes.forEach((b) => {
          const noteName = iNote(curKey, b.i[0], b.i[1]);
          const ns = N2S[noteName];
          const fill = FB_FILL[b.t] || "#888780";
          FB_OPEN.forEach((str) => {
            const fret = (((ns - str.semi) % 12) + 12) % 12;
            const cx = dotX(fret),
              cy = str.y;
            s += `<circle cx="${cx}" cy="${cy}" r="10.5" fill="${fill}" stroke="white" stroke-width="1.5"/>`;
            s += `<text x="${cx}" y="${cy + 3.5}" text-anchor="middle" font-size="8.5" font-weight="600" fill="white">${noteName}</text>`;
          });
        });
        s += `</svg>`;
        return s;
      }

      function makePosTable(bassNotes) {
        const isE = curTab === "eng";
        const STR = [
          { n: "E", s: 4 },
          { n: "A", s: 9 },
          { n: "D", s: 2 },
          { n: "G", s: 7 },
        ];
        let h = `<div class="pos-wrap"><table class="pos-table">
    <thead><tr><th>${isE ? "Note" : "Note"}</th><th>E string</th><th>A string</th><th>D string</th><th>G string</th></tr></thead><tbody>`;
        bassNotes.forEach((b) => {
          const noteName = iNote(curKey, b.i[0], b.i[1]);
          const ns = N2S[noteName];
          const frets = STR.map((st) => (((ns - st.s) % 12) + 12) % 12);
          const minF = Math.min(...frets);
          h += `<tr><td><span class="pill ${b.t}">${noteName}</span></td>`;
          frets.forEach((f) => {
            const best = f === minF;
            h += `<td class="${best ? "best" : ""}">${f === 0 ? `<span class="open-lbl">open</span>` : `fret ${f}`}${best ? '<span class="star">★</span>' : ""}</td>`;
          });
          h += `</tr>`;
        });
        h += `</tbody></table></div>`;
        return h;
      }

      function renderFretboard() {
        const isE = curTab === "eng";
        const gs = groups();
        const total = gs.reduce((s, g) => s + g.rows.length, 0);
        document.getElementById("badge").textContent =
          total + (isE ? " chords" : " hợp âm");
        let html = "";
        gs.forEach((g) => {
          const gname = isE ? g.groupE : g.group;
          html += `<div class="group-block"><div class="group-label">${gname}<span class="grp-cnt">(${g.rows.length})</span></div>`;
          g.rows.forEach((r) => {
            const cn = tChord(r.name, curKey);
            const ps = r.b
              .map(
                (b) =>
                  `<span class="pill ${b.t}">${iNote(curKey, b.i[0], b.i[1])}</span>`,
              )
              .join("");
            html += `<div class="fb-card">
        <div class="fb-hdr"><div><span class="fb-cname">${cn}</span><span class="fb-fm">${r.f}</span></div><div class="pills">${ps}</div></div>
        <div class="fb-fret">${makeFretSVG(r.b)}</div>
        ${makePosTable(r.b)}
      </div>`;
          });
          html += `</div>`;
        });
        document.getElementById("container").innerHTML = html;
      }

      function render() {
        buildLegend();
        if (curTab === "vie") renderTable("vie");
        else if (curTab === "eng") renderTable("eng");
        else renderFretboard();
      }

      buildFilters();
      render();
    </script>
  </body>
</html>
