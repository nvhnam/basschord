            },
            {
              name: "C7#11",
              aka: "Lydian dom",
              f: "1–3–b7–#11",
              ni: [
                [1, ""],
                [3, ""],
                [7, "b"],
                [4, "#"],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [7, "b"], t: "n-7th" },
                { i: [4, "#"], t: "n-tension" },
              ],
              tip: "#11 = Lydian dominant.",
              tipE: "#11 = Lydian dominant.",
            },
            {
              name: "C7#9b13",
              aka: "C7alt",
              f: "1–3–b7–#9–b13",
              ni: [
                [1, ""],
                [3, ""],
                [7, "b"],
                [2, "#"],
                [6, "b"],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [7, "b"], t: "n-7th" },
                { i: [2, "#"], t: "n-tension" },
              ],
              tip: "Full altered — căng nhất.",
              tipE: "Full altered dominant — maximum tension.",
            },
          ],
        },
        {
          group: "Extended chords",
          groupE: "Extended Chords",
          cat: "ext",
          rows: [
            {
              name: "Cmaj7#11",
              aka: "Lydian",
              f: "1–3–maj7–#11",
              ni: [
                [1, ""],
                [3, ""],
                [7, ""],
                [4, "#"],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [7, ""], t: "n-7th" },
                { i: [4, "#"], t: "n-tension" },
              ],
              tip: "#11 = jazz hiện đại.",
              tipE: "#11 = modern jazz sound.",
            },
            {
              name: "Cm11",
              aka: "",
              f: "1–b3–b7–11",
              ni: [
                [1, ""],
                [3, "b"],
                [7, "b"],
                [4, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, "b"], t: "n-3rd" },
                { i: [7, "b"], t: "n-7th" },
                { i: [4, ""], t: "n-tension" },
              ],
              tip: "11th rất hay trong neo-soul.",
              tipE: "11th very effective in neo-soul.",
            },
            {
              name: "C13#11",
              aka: "",
              f: "1–3–b7–#11–13",
              ni: [
                [1, ""],
                [3, ""],
                [7, "b"],
                [4, "#"],
                [6, ""],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
                { i: [7, "b"], t: "n-7th" },
                { i: [4, "#"], t: "n-tension" },
              ],
              tip: "Jazz fusion.",
              tipE: "Jazz fusion — Herbie Hancock signature.",
            },
          ],
        },
        {
          group: "Slash & đảo vị",
          groupE: "Slash & Inversions",
          cat: "other",
          rows: [
            {
              name: "C/E",
              aka: "1st inv.",
              f: "E bass",
              ni: [
                [3, ""],
                [1, ""],
                [3, ""],
                [5, ""],
              ],
              b: [
                { i: [3, ""], t: "n-3rd" },
                { i: [1, ""], t: "n-root" },
                { i: [5, ""], t: "n-5th" },
              ],
              tip: "Bass chơi 3rd.",
              tipE: "Bass plays 3rd — smooth voice leading.",
            },
            {
              name: "C/G",
              aka: "2nd inv.",
              f: "G bass",
              ni: [
                [5, ""],
                [1, ""],
                [3, ""],
                [5, ""],
              ],
              b: [
                { i: [5, ""], t: "n-5th" },
                { i: [1, ""], t: "n-root" },
                { i: [3, ""], t: "n-3rd" },
              ],
              tip: "Bass chơi 5th.",
              tipE: "Bass plays 5th — supportive.",
            },
            {
              name: "Cdim7",
              aka: "C°7",
              f: "1–b3–b5–bb7",
              ni: [
                [1, ""],
                [3, "b"],
                [5, "b"],
                [7, "bb"],
              ],
              b: [
                { i: [1, ""], t: "n-root" },
                { i: [3, "b"], t: "n-3rd" },
                { i: [5, "b"], t: "n-5th" },
                { i: [7, "bb"], t: "n-7th" },
              ],
              tip: "Passing chord.",
              tipE: "Passing chord between diatonic chords.",
            },
          ],
        },
      ];

      // ── State ───────────────────────────────────────────────────────────────────
      let curKey = "C",
        curFilter = "all",
        curTab = "vl",
        curStrings = 4,
        curAlgo = "stepwise",
        curLIL = true;
      const KEYS = [
        { l: "C", k: "C" },
        { l: "Db", k: "Db" },
        { l: "D", k: "D" },
        { l: "Eb", k: "Eb" },
        { l: "E", k: "E" },
        { l: "F", k: "F" },
        { l: "F#", k: "F#" },
        { l: "G", k: "G" },
        { l: "Ab", k: "Ab" },
        { l: "A", k: "A" },
        { l: "Bb", k: "Bb" },
        { l: "B", k: "B" },
      ];

      // ── Key selector ────────────────────────────────────────────────────────────
      const keyEl = document.getElementById("keySelector");
      KEYS.forEach((k) => {
        const b = document.createElement("button");
        b.className = "key-btn" + (/[#b]/.test(k.l) ? " acc" : "");
        b.textContent = k.l;
        if (k.l === "C") b.classList.add("active");
        b.onclick = () => {
          keyEl
            .querySelectorAll(".key-btn")
            .forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          curKey = k.k;
          render();
        };
        keyEl.appendChild(b);
      });

      // ── String toggle ───────────────────────────────────────────────────────────
      document.getElementById("stringToggle").addEventListener("click", (e) => {
        const b = e.target.closest(".st-btn");
        if (!b) return;
        document
          .querySelectorAll(".st-btn")
          .forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        curStrings = parseInt(b.dataset.strings);
        render();
      });

      // ── Tab bar ─────────────────────────────────────────────────────────────────
      document.getElementById("tabBar").addEventListener("click", (e) => {
        const b = e.target.closest(".tab-btn");
        if (!b) return;
        document
          .querySelectorAll(".tab-btn")
          .forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        curTab = b.dataset.tab;
        buildFilters();
        render();
      });

      // ── Algo options ────────────────────────────────────────────────────────────
      document.getElementById("algoOpts").addEventListener("click", (e) => {
        const b = e.target.closest(".algo-btn");
        if (!b) return;
        document
          .querySelectorAll("#algoOpts .algo-btn")
          .forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        curAlgo = b.dataset.algo;
      });

      // ── LIL toggle ──────────────────────────────────────────────────────────────
      document
        .getElementById("lilToggle")
        .addEventListener("click", function () {
          curLIL = !curLIL;
          this.textContent = curLIL ? "ON" : "OFF";
          this.classList.toggle("active", curLIL);
        });

      // ── Analyze button ───────────────────────────────────────────────────────────
      document.getElementById("vlAnalyze").onclick = () => {
        renderProgression(document.getElementById("vlInput").value);
      };
      document.getElementById("vlInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") renderProgression(e.target.value);
      });

      function setPreset(val) {
        document.getElementById("vlInput").value = val;
        renderProgression(val);
      }

      // ── Filters ─────────────────────────────────────────────────────────────────
      const FILTERS_VIE = [
        { l: "Tất cả", c: "all" },
        { l: "Triads", c: "triad" },
        { l: "Major 7th", c: "maj7" },
        { l: "Minor 7th", c: "min7" },
        { l: "Dominant", c: "dom7" },
        { l: "Altered", c: "alt" },
        { l: "Extended", c: "ext" },
        { l: "Slash", c: "other" },
      ];
      const FILTERS_ENG = [
        { l: "All", c: "all" },
        { l: "Triads", c: "triad" },
        { l: "Maj 7th", c: "maj7" },
        { l: "Min 7th", c: "min7" },
        { l: "Dominant", c: "dom7" },
        { l: "Altered", c: "alt" },
        { l: "Extended", c: "ext" },
        { l: "Slash", c: "other" },
      ];

      function buildFilters() {
        const fbar = document.getElementById("filterBar");
        fbar.innerHTML = "";
        const filters =
          curTab === "eng" || curTab === "fretboard"
            ? FILTERS_ENG
            : FILTERS_VIE;
        const show = curTab !== "vl";
        document.querySelector(".controls").style.display = show
          ? "flex"
          : "none";
        if (!show) return;
        filters.forEach((f) => {
          const b = document.createElement("button");
          b.className = "fbtn" + (f.c === curFilter ? " active" : "");
          b.textContent = f.l;
          b.dataset.cat = f.c;
          b.onclick = () => {
            fbar
              .querySelectorAll(".fbtn")
              .forEach((x) => x.classList.remove("active"));
            b.classList.add("active");
            curFilter = f.c;
            render();
          };
          fbar.appendChild(b);
        });
        document.getElementById("fltLbl").textContent =
          curTab === "eng" ? "Group:" : "Nhóm:";
      }

      function groups() {
        return curFilter === "all"
          ? DATA
          : DATA.filter((g) => g.cat === curFilter);
      }

      function buildLegend() {
        const isE = curTab === "eng" || curTab === "fretboard";
        const items = isE
          ? [
              { c: "#378ADD", l: "Root (required)" },
              { c: "#639922", l: "3rd / b3 (quality)" },
              { c: "#c07820", l: "7th (color)" },
              { c: "#7a60d8", l: "Tension (9,11,13,alt)" },
              { c: "#555550", l: "5th (neutral)" },
            ]
          : [
              { c: "#378ADD", l: "Root (bắt buộc)" },
              { c: "#639922", l: "3rd / b3" },
              { c: "#c07820", l: "7th" },
              { c: "#7a60d8", l: "Tension" },
              { c: "#555550", l: "5th" },
            ];
        document.getElementById("legend").innerHTML = items
          .map(
            (i) =>
              `<div class="leg-item"><div class="leg-dot" style="background:${i.c}"></div>${i.l}</div>`,
          )
          .join("");
      }

      // ── Fretboard SVG for reference view ────────────────────────────────────────
      function makeFretSVG_ref(bassNotes) {
        const strings = getStrings();
        const placed = [];
        bassNotes.forEach((b) => {
          const noteName = iNote(curKey, b.i[0], b.i[1]);
          const ns = N2S[noteName];
          const roleMap = {
            "n-root": "root",
            "n-3rd": "3rd",
            "n-7th": "7th",
            "n-tension": "tension",
            "n-5th": "5th",
          };
          const role = roleMap[b.t] || "5th";
          strings.forEach((str) => {
            placed.push({
              strObj: str,
              fret: fretOf(ns, str.semi),
              semi: ns,
              role,
            });
          });
        });
        return makeFretSVG(placed, strings, new Set(), [], false, null);
      }

      function makePosTable(bassNotes) {
        const strings = getStrings();
        const isE = curTab === "eng";
        let h = `<div class="pos-wrap"><table class="pos-table"><thead><tr><th>Note</th>`;
        strings.forEach((s) => (h += `<th>${s.name}</th>`));
        h += `</tr></thead><tbody>`;
        bassNotes.forEach((b) => {
          const noteName = iNote(curKey, b.i[0], b.i[1]);
          const ns = N2S[noteName];
          const frets = strings.map((st) => fretOf(ns, st.semi));
          const minF = Math.min(...frets);
          h += `<tr><td><span class="pill ${b.t}">${noteName}</span></td>`;
          frets.forEach((f) => {
            const best = f === minF;
            h += `<td class="${best ? "best" : ""}">${f === 0 ? `<span class="open-lbl">open</span>` : `fret ${f}`}${best ? '<span class="star">★</span>' : ""}</td>`;
          });
          h += `</tr>`;
        });
        h += `</tbody></table></div>`;
        return h;
      }

      // ── Render functions ─────────────────────────────────────────────────────────
      function renderTable(lang) {
        const gs = groups();
        const total = gs.reduce((s, g) => s + g.rows.length, 0);
        document.getElementById("badge").textContent =
          total + (lang === "eng" ? " chords" : " hợp âm");
        let html = "";
        gs.forEach((g) => {
          const gname = lang === "eng" ? g.groupE : g.group;
          html += `<div class="group-block"><div class="group-label">${gname}<span class="grp-cnt"> (${g.rows.length})</span></div>
    <table class="ctable"><thead><tr>
      <th style="width:105px">${lang === "eng" ? "Chord" : "Hợp âm"}</th>
      <th style="width:110px">${lang === "eng" ? "Formula" : "Công thức"}</th>
      <th>${lang === "eng" ? "All notes" : "Tất cả notes"}</th>
      <th style="width:190px">${lang === "eng" ? "Bass notes" : "Notes cho bass"}</th>
      <th>${lang === "eng" ? "Notes" : "Ghi chú"}</th>
    </tr></thead><tbody>`;
          g.rows.forEach((r) => {
            const cn = tChord(r.name, curKey);
            const ns = renderNi(r.ni, curKey);
            const ps = r.b
              .map(
                (b) =>
                  `<span class="pill ${b.t}">${iNote(curKey, b.i[0], b.i[1])}</span>`,
              )
              .join("");
            const tip = lang === "eng" ? r.tipE : r.tip;
            html += `<tr>
        <td><div class="cname">${cn}</div>${r.aka ? `<div class="caka">${r.aka}</div>` : ""}</td>
        <td class="cfm">${r.f}</td>
        <td class="cnotes">${ns}</td>
        <td><div class="pills">${ps}</div></td>
        <td class="ctip">${tip}</td>
      </tr>`;
          });
          html += `</tbody></table></div>`;
        });
        document.getElementById("container").innerHTML = html;
      }

      function renderFretboard() {
        const isE = true;
        const gs = groups();
        const total = gs.reduce((s, g) => s + g.rows.length, 0);
        document.getElementById("badge").textContent = total + " chords";
        let html = "";
        gs.forEach((g) => {
          html += `<div class="group-block"><div class="group-label">${g.groupE}<span class="grp-cnt"> (${g.rows.length})</span></div>`;
          g.rows.forEach((r) => {
            const cn = tChord(r.name, curKey);
            const ps = r.b
              .map(
                (b) =>
                  `<span class="pill ${b.t}">${iNote(curKey, b.i[0], b.i[1])}</span>`,
              )
              .join("");
            const strLabel = curStrings === 5 ? "5-str" : "4-str";
            html += `<div class="fb-card">
        <div class="fb-hdr">
          <div><span class="fb-cname">${cn}</span><span class="fb-fm">${r.f}</span></div>
          <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--text3);font-family:'Space Mono',monospace">${strLabel}</span><div class="pills">${ps}</div></div>
        </div>
        <div class="fb-fret">${makeFretSVG_ref(r.b)}</div>
        ${makePosTable(r.b)}
      </div>`;
          });
          html += `</div>`;
        });
        document.getElementById("container").innerHTML = html;
      }

      function renderVL() {
        document.getElementById("container").innerHTML =
          `<div style="padding:2rem 0;text-align:center;color:var(--text3);font-family:'Space Mono',monospace;font-size:12px">
    <div style="font-size:32px;margin-bottom:1rem">◆</div>
    <div>Enter a chord progression above to analyze voice leading</div>
    <div style="margin-top:.5rem;opacity:.6">e.g. Dm7 G7 Cmaj7 &nbsp;·&nbsp; ii7 V7 Imaj7 &nbsp;·&nbsp; Am7 D7 Gmaj7</div>
  </div>`;
        document.getElementById("legend").innerHTML = "";
      }

      function render() {
        document.getElementById("vlPanel").style.display =
          curTab === "vl" ? "block" : "none";
        buildLegend();
        if (curTab === "vl") renderVL();
        else if (curTab === "vie") renderTable("vie");
        else if (curTab === "eng") renderTable("eng");
        else renderFretboard();
      }

      buildFilters();
      render();

      // Auto-load a demo on first load
      setTimeout(() => {
        if (curTab === "vl") {
          document.getElementById("vlInput").value = "Dm7 G7 Cmaj7";
          renderProgression("Dm7 G7 Cmaj7");
        }
      }, 200);
    </script>
  </body>
</html>
